name: Amazon DocumentDB

description: Amazon DocumentDB is a fully managed, MongoDB-compatible document database service that makes it easy to set up, operate, and scale
  MongoDB-compatible databases in the cloud. DocumentDB is designed from the ground up to give you the performance, scalability, and availability
  you need when operating mission-critical MongoDB workloads at scale.

